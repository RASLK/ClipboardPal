# Orchestrates Flameshot-style packaging workflows and publishes a GitHub Release.
# Trigger: git tag vX.Y.Z && git push origin vX.Y.Z
#
# Layout (same idea as flameshot-org/flameshot/.github/workflows):
#   windows-pack.yml → MSI + ZIP + .sha256sum
#   macos-pack.yml   → DMG + .sha256sum
#   linux-pack.yml   → AppImage + ZIP + .sha256sum
#   release.yml      → this file (tag → pack → Release assets)
#
# .sha256sum files: plaintext checksums so users can verify downloads were not corrupted
#   or tampered with (sha256sum -c file.sha256sum).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (used only for manual dispatch without a tag)
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="v${{ inputs.version }}"
            TAG="${TAG#vv}"
          else
            echo "Need a tag push or workflow_dispatch version input" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    uses: ./.github/workflows/windows-pack.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/macos-pack.yml
    with:
      version: ${{ needs.version.outputs.version }}

  linux:
    needs: version
    uses: ./.github/workflows/linux-pack.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Create GitHub Release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    # Only publish a Release when a real tag was pushed (not bare manual pack).
    if: github.ref_type == 'tag'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClipboardPal ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Downloads

            | Platform | Installer | Portable |
            | --- | --- | --- |
            | Windows x64 | `ClipboardPal-*-win64.msi` | `*-win64.zip` |
            | Windows x86 | `ClipboardPal-*-win32.msi` | `*-win32.zip` |
            | macOS Apple Silicon | `ClipboardPal-*-macos-arm64.dmg` | — |
            | macOS Intel | `ClipboardPal-*-macos-intel.dmg` | — |
            | Linux x64 | `ClipboardPal-*-linux-x64.AppImage` | `*-linux-x64.zip` |

            Each package has a matching **`.sha256sum`** — verify with:
            `sha256sum -c ClipboardPal-….sha256sum`

            **macOS:** builds are unsigned. If Gatekeeper blocks: right-click → **Open**.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
