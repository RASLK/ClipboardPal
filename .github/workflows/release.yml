# Builds self-contained single-file binaries and attaches them to a GitHub Release.
# Trigger: push a version tag, e.g. git tag v2.0.0 && git push origin v2.0.0
#
# Private repos: Actions uses your plan minutes (macOS costs more). This workflow
# runs only on tags — fine when you release rarely.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: src/ClipboardPal.App/ClipboardPal.App.csproj

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-13
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          out="publish/${{ matrix.rid }}"
          mkdir -p "$out"
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            -o "$out" \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --verbosity minimal

      - name: Pack zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          out="publish/${RID}"
          asset="ClipboardPal-${VERSION}-${RID}.zip"

          if [[ "$RID" == win-* ]]; then
            bin="$out/ClipboardPal.exe"
          else
            bin="$out/ClipboardPal"
            chmod +x "$bin"
          fi

          if [[ ! -f "$bin" ]]; then
            echo "Expected binary not found: $bin"
            ls -la "$out"
            exit 1
          fi

          # Prefer a zip that contains only the single-file binary.
          mkdir -p dist
          if command -v zip >/dev/null 2>&1; then
            (cd "$out" && zip -9 "../../dist/${asset}" "$(basename "$bin")")
          else
            # Windows runners: Compress-Archive via PowerShell
            pwsh -NoProfile -Command \
              "Compress-Archive -Path '$bin' -DestinationPath 'dist/${asset}' -Force"
          fi

          ls -lh "dist/${asset}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardPal-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClipboardPal ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
